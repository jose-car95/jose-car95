name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # github-readme-stats.vercel.app (official instance) has been paused by
      # its owner, so we render against a maintained fork and self-host the
      # resulting SVGs in assets/, the same way assets/42badge.svg is handled.
      - name: Download GitHub stats
        run: |
          mkdir -p assets
          curl -Lf "https://github-stats-extended.vercel.app/api?username=jose-car95&show_icons=true&theme=tokyonight&hide_border=true&icon_color=8b5cf6&title_color=8b5cf6&count_private=true" -o assets/github-stats.svg
          curl -Lf "https://github-stats-extended.vercel.app/api/top-langs/?username=jose-car95&layout=compact&theme=tokyonight&hide_border=true&title_color=8b5cf6" -o assets/top-langs.svg

      - name: Commit stats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "update GitHub stats"
          git push
