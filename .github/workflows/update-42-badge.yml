name: Update 42 Badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate 42 badge
        shell: bash
        run: |
          set -euo pipefail
          url="https://badge.mediaplus.ma/darkblue/jose-car"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          curl --fail --location --silent --show-error --retry 3 "$url" -o "$tmp"

          if [[ ! -s "$tmp" ]]; then
            echo "::error::42 badge download returned an empty file; keeping the existing badge."
            exit 1
          fi

          if ! grep -Eq '<svg([[:space:]>])' "$tmp"; then
            echo "::error::Downloaded content is not an SVG; keeping the existing badge."
            head -c 300 "$tmp" || true
            exit 1
          fi

          install -m 0644 "$tmp" assets/42badge.svg

      - name: Commit badge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/42badge.svg
          git diff --staged --quiet || git commit -m "update 42 badge"
          git push
